iran_dns: "IRAN_DNS_IP"
global_dns: "GLOBAL_DNS_IP"
listen: ":53"
min_ttl: 300
max_ttl: 3600
iran_ranges: "data/iran-ranges.txt"
learned: "data/learned.conf"
iran_dns_timeout: 3
log_level: "info"
log_format: "json"
log_file: "/var/log/sentrydns/sentrydns.log"
metrics_addr: ":9153"

iran_tlds:
  - "ir"
  - "ایران"

hijack_ips:
  - "10.10.34.34"
  - "10.10.34.35"
  - "10.10.34.36"

hijack_ranges:
  - "50.7.0.0/16"

prefer_iran_domains:
  - "google.com"
  - "easy4ipcloud.com"

# Optional static A records — answered directly, never forwarded to upstreams.
# Exact FQDN match only. AAAA and other query types fall through to normal routing.
static_records:
  "internal.example.com": "10.0.0.5"
  "vpn.example.com": "192.168.1.10"

iran_ranges_url: "http://example.com/ranges.txt"
iran_ranges_update_interval: 24h
state_file: "data/.sentrydns-state"

# circuit breaker: open after N consecutive Iran failures
iran_cb_threshold: 30
iran_cb_cooldown: 30s

# circuit breaker: open after N consecutive Global failures
global_cb_threshold: 30
global_cb_cooldown: 30s

# Per-client rate limit in queries/second (0 = disabled).
# Applied per source IP; behind a NAT this caps all users behind that IP.
rate_limit_per_client: 0

# Global QPS cap across ALL clients (0 = disabled).
# Token bucket with 1s burst capacity. Protects the server and upstreams
# from floods, forwarding loops, and runaway clients.
global_qps_limit: 0

# Loop protection: refuse (REFUSED) queries arriving from configured
# upstream IPs (iran_dns / global_dns / global_dns_fallback). Catches
# misconfigurations where an upstream forwards back to sentrydns.
loop_detection: true

cleanup_initial_delay: 1h
cleanup_qps: 100

# Global DNS timeout in seconds (separate from main timeout, applied only to global upstream)
global_dns_timeout: 10

# Optional fallback DNS for global queries (empty = disabled)
global_dns_fallback: "8.8.8.8"

# Scheduled cleanup time (HH:MM format, 24h). Runs daily at this wall-clock time.
# Falls back to cleanup_initial_delay + 24h interval if left empty.
cleanup_schedule: "02:00"
