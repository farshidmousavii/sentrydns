iran_dns: "IRAN_DNS_IP"
global_dns: "GLOBAL_DNS_IP"
listen: ":53"
min_ttl: 300
max_ttl: 3600
iran_ranges: "data/iran-ranges.txt"
learned: "data/learned.conf"
iran_dns_timeout: 3
log_level: "info"
log_format: "json"
log_file: "/var/log/sentrydns/sentrydns.log"
metrics_addr: ":9153"

iran_tlds:
  - "ir"
  - "ایران"

hijack_ips:
  - "10.10.34.34"
  - "10.10.34.35"
  - "10.10.34.36"

hijack_ranges:
  - "50.7.0.0/16"

prefer_iran_domains:
  - "google.com"
  - "easy4ipcloud.com"

iran_ranges_url: "http://example.com/ranges.txt"
iran_ranges_update_interval: 24h
state_file: "data/.sentrydns-state"

# circuit breaker: open after N consecutive Iran failures
iran_cb_threshold: 10
iran_cb_cooldown: 30s

# circuit breaker: open after N consecutive Global failures
global_cb_threshold: 30
global_cb_cooldown: 30s

cleanup_initial_delay: 1h
cleanup_qps: 100

# Global DNS timeout in seconds (separate from main timeout, applied only to global upstream)
global_dns_timeout: 10

# Optional fallback DNS for global queries (empty = disabled)
global_dns_fallback: "8.8.8.8"

# Scheduled cleanup time (HH:MM format, 24h). Runs daily at this wall-clock time.
# Falls back to cleanup_initial_delay + 24h interval if left empty.
cleanup_schedule: "02:00"
